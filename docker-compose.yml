# QualiTrack Edge Service on the local station (report 4.1.3.4): the service
# qualitrack-edge runs the Edge REST API on Gunicorn and the qualitrack-data
# volume keeps the SQLite database, so the readings survive a restart or the
# recreation of the container.
#
#   cp .env.example .env.production    # then set TEST_DEVICE_ID and the CLOUD_* settings
#   docker compose up -d --build
services:
  qualitrack-edge:
    build: .
    image: qualitrack-edge:latest
    restart: unless-stopped
    env_file: .env.production
    # Production values that the settings file cannot change.
    environment:
      APP_ENV: production
      DEBUG: "false"
      SEED_TEST_DEVICE: "false"
      DATABASE_PATH: /data/edge.db
      HOST: 0.0.0.0
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - qualitrack-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qualitrack-data:
    name: qualitrack-data
